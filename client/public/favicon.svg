<svg xmlns="http://w3.org" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b14" />
      <stop offset="100%" stop-color="#02050a" />
    </linearGradient>

    <!-- Glowing Vector Gradients -->
    <linearGradient id="telemetryTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="signalPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.0" />
    </linearGradient>

    <!-- Atmospheric Blur Glow Filter -->
    <filter id="radarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .main-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; fill: #ffffff; font-size: 56px; letter-spacing: -0.5px; }
    .sub-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; fill: #99f6e4; font-size: 16px; letter-spacing: 5px; opacity: 0.85; }
    .data-metric { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; fill: #2dd4bf; opacity: 0.7; letter-spacing: 1.5px; }
    .sonar-ring { fill: none; stroke: #0ea5e9; stroke-opacity: 0.15; stroke-width: 1; }
    .wave-path { fill: none; stroke: url(#telemetryTeal); stroke-width: 2; stroke-linecap: round; opacity: 0.25; }
  </style>

  <!-- Base Dark Space -->
  <rect width="1200" height="600" fill="url(#bgGrad)" />

  <!-- Research Concentric Radar Rings (Right Panel Background) -->
  <g transform="translate(900, 300)">
    <circle r="260" class="sonar-ring" />
    <circle r="190" class="sonar-ring" stroke-dasharray="5 5" stroke-opacity="0.25" />
    <circle r="120" class="sonar-ring" />
    <circle r="50" class="sonar-ring" stroke-opacity="0.3" />
    <!-- Radar Scanning Axes Lines -->
    <line x1="-280" y1="0" x2="280" y2="0" stroke="#0ea5e9" stroke-opacity="0.08" stroke-width="1" />
    <line x1="0" y1="-280" x2="0" y2="280" stroke="#0ea5e9" stroke-opacity="0.08" stroke-width="1" />
  </g>

  <!-- Bio-Acoustic Signal Frequency Waves (Center Lower Overlay) -->
  <g transform="translate(0, 480)">
    <path d="M 0,20 Q 75,-40 150,10 T 300,-10 T 450,30 T 600,-30 T 750,20 T 900,-20 T 1050,40 T 1200,0" class="wave-path" />
    <path d="M 0,0 Q 90,50 180,-10 T 360,20 T 540,-40 T 720,10 T 900,-30 T 1080,30 T 1200,-10" class="wave-path" stroke-opacity="0.15" stroke-width="1.5" />
  </g>

  <!-- Central WildSphere Protected Area Tracking Cluster -->
  <g transform="translate(200, 260)">
    <!-- Global Protection Sphere Ring -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#signalPulse)" stroke-width="3" />
    <circle cx="0" cy="0" r="78" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.3" />
    
    <!-- Geodesic Network Wireframe lines -->
    <polygon points="0,-78 67,40 -67,40" fill="none" stroke="#0ea5e9" stroke-opacity="0.2" stroke-width="1" />
    <polygon points="0,78 67,-40 -67,-40" fill="none" stroke="#0ea5e9" stroke-opacity="0.1" stroke-width="1" />

    <!-- Centerpiece Brand Element: Global Biosphere + Animal Indicator Pin -->
    <g transform="translate(0, -5)">
      <!-- Outer Tracking Ring Base -->
      <path d="M 0,-40 C -22,-40 -40,-22 -40,0 C -40,25 0,55 0,55 C 0,55 40,25 40,0 C 40,-22 22,-40 0,-40 Z" fill="url(#telemetryTeal)" filter="url(#radarGlow)" opacity="0.9" />
      <!-- Minimalist Dynamic Abstract Animal/Ecosystem Form (Cutout Space) -->
      <circle cx="0" cy="-5" r="15" fill="#040b14" />
      <path d="M -10,10 C -5,2 5,2 10,10 Z" fill="#040b14" />
      <circle cx="0" cy="-5" r="4" fill="#2dd4bf" />
    </g>

    <!-- Telemetry Precision Corner Crosshairs -->
    <path d="M -110,-60 L -110,-80 L -90,-80" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
    <path d="M 110,-60 L 110,-80 L 90,-80" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
    <path d="M -110,60 L -110,80 L -90,80" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
    <path d="M 110,60 L 110,80 L 90,80" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Telemetry Scatter Nodes (Mocking Tagged Wildlife Data Points) -->
  <g fill="#2dd4bf">
    <circle cx="820" cy="180" r="5" filter="url(#radarGlow)" />
    <line x1="820" y1="180" x2="940" y2="240" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="940" cy="240" r="3" opacity="0.8" />
    <circle cx="910" cy="420" r="4" opacity="0.5" />
    <circle cx="1020" cy="310" r="4" filter="url(#radarGlow)" />
    <line x1="940" y1="240" x2="1020" y2="310" stroke="#0ea5e9" stroke-opacity="0.2" stroke-width="1" />
  </g>

  <!-- Typography Elements -->
  <text x="360" y="260" class="main-title">WildSphere</text>
  <text x="365" y="295" class="sub-title">GLOBAL WILDLIFE RESEARCH &amp; TELEMETRY</text>

  <!-- UI Interface Metadata Grid Overlays -->
  <text x="365" y="340" class="data-metric">NET_STATUS: CONNECTED // SATELLITE_UPLINK: ACTIVE</text>
  <text x="50" y="550" class="data-metric">WILD_SPHERE_CORE_v1.0.4</text>
  <text x="960" y="550" class="data-metric">SIGNAL_LOCK // 44.319 N, 9.682 W</text>
</svg>
